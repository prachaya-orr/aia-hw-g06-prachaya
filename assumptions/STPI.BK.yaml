# ค่า kind: derived คำนวณจากอดีต · assumption ต้องอ้างเหตุผลจาก research/playbook.md ก่อนเปลี่ยน status
ticker: STPI.BK
status: reviewed   # ผู้เรียนยืนยันข้อเสนอ 5 ข้อใน research/STPI.BK_method_choice.md เมื่อ 2026-10-31
method_choice: research/STPI.BK_method_choice.md
methods:
- dcf_fcff
- comps_ev_ebitda
- comps_pb
- week52
method_reasons:
  dcf_fcff: ธุรกิจรับเหมาตามโครงการที่กำไรขึ้นลงตามรอบ ใช้ DCF บน operating margin เฉลี่ยตลอดรอบ ไม่ใช้ปีที่กำไรสูงหรือต่ำสุดเป็นฐาน
    และบวกเงินลงทุนกับอสังหาฯ เพื่อการลงทุนที่ไม่อยู่ใน EBIT (playbook §1, §2, §8)
  comps_ev_ebitda: playbook แนะนำ EV/EBITDA บนตัวเลขที่ normalize แล้วสำหรับธุรกิจ cyclical จึงใช้ EBITDA margin เฉลี่ย 2022–2025
    × รายได้ปีล่าสุด (playbook §1, §8, §9)
  comps_pb: ใช้เป็นแท่งอ้างอิงฝั่งสินทรัพย์ เพราะ P/E ใช้ไม่ได้ (ขาดทุน TTM) และ book ครึ่งหนึ่งเป็นเงินลงทุนกับอสังหาฯ ตัวขับของ
    P/BV คือ ROE notebook ไม่ได้แนะนำ P/BV สำหรับ cyclical โดยตรง (playbook §9)
  week52: แท่งมาตรฐานของ football field (playbook §13)
  comps_pe: EPS ย้อนหลัง 12 เดือนติดลบ (−฿0.01) P/E ใช้กับบริษัทขาดทุนไม่ได้ และ P/E ของ cyclical หลอกตาตามรอบกำไร (playbook
    §8, §9)
  ddm: ไม่จ่ายปันผลตั้งแต่ปี 2020 (playbook §5)
limitations:
- ประวัติงบใน Yahoo มีแค่ 4 ปี (2022–2025) สั้นกว่าช่วง 5–10 ปีที่ playbook §8 แนะนำ และอาจไม่ครอบคลุมทั้งรอบ
- STPI ซื้อกิจการทุกปี 2023–2025 (Purchase Of Business ฿1,744 / 559 / 168 ล้าน) สินทรัพย์ถาวร หนี้ ค่าเสื่อม และ minority
  เพิ่มมากในปี 2024 ค่าเฉลี่ย 4 ปีจึงปนธุรกิจก่อนและหลังซื้อกิจการ Yahoo ไม่บอกว่าซื้ออะไร
- DCF ใช้ operating margin เฉลี่ยตลอดรอบ (5.35%) ถ้าธุรกิจหลังซื้อกิจการทำ margin ได้แบบปี 2025 (12.53%) ต่อเนื่อง มูลค่าจะสูงขึ้นมาก
  (ดู scenario ใน research/STPI.BK_method_choice.md)
- สินทรัพย์ที่ไม่ใช่การดำเนินงาน (฿5.17 พันล้าน) ใช้มูลค่าตามบัญชี playbook §2 ให้ใช้มูลค่าตลาดแต่ Trust sources ไม่มีมูลค่ายุติธรรมของอสังหาฯ
  และเงินลงทุนในบริษัทร่วม/JV
- 'peer มีธุรกิจไม่ตรงกัน: BJCHI ใกล้ที่สุดแต่ EBITDA ติดลบ, SRICHA P/E 3.19 เท่าน่าจะมีกำไรพิเศษ, CK และ STECON เป็นผู้รับเหมางานโยธาที่มีเงินลงทุนมาก'
- EBITDA ของ peer เป็นงวดล่าสุดไม่ได้ normalize ขณะที่ของ STPI normalize แล้ว และ EV ของ peer ไม่ได้หักเงินลงทุนของ peer เอง
- ปลายแท่งใน football field (P25–P75 ของ peer และกล่อง ±0.5% ของ DCF) เป็นการเลือกของผู้เรียน notebook ไม่มีกฎ (playbook §13)
- ไม่มี precedent transactions และ analyst target price เพราะไม่มีข้อมูลใน Trust sources
