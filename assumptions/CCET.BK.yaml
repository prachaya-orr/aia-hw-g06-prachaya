ticker: CCET.BK
status: draft
method_choice: research/CCET.BK_method_choice.md
methods:
- dcf_fcff
- comps_pe
- comps_ev_ebitda
- week52
method_reasons:
  dcf_fcff: ผู้ผลิตฮาร์ดแวร์ที่รายได้และกำไรผันผวนตามรอบ ใช้ DCF บนรายได้และ margin ที่ normalize และรวม country risk premium สำหรับตลาดเกิดใหม่ (playbook §1, §3, §8)
  comps_pe: บริษัทมีกำไรและ peer มีกำไรทุกตัว ใช้ P/E เป็น equity multiple โดยอ่านร่วมกับความต่างด้าน growth และ risk (playbook §9)
  comps_ev_ebitda: ธุรกิจใช้เงินทุนและ leverage ต่างกัน ใช้ enterprise multiple บน EBITDA ที่คำนวณด้วยนิยามเดียวกันจากงบรายปี (playbook §8, §9)
  week52: แท่งมาตรฐานของ football field (playbook §13)
  ddm: payout เทียบ EPS ผันผวนจาก 19% ในปี 2022 เป็น 100% ในปี 2025 และยังไม่ได้พิสูจน์ว่าปันผลใกล้ FCFE จึงไม่ใช้ DDM (playbook §1, §5)
  comps_pb: ตัวขับหลักของ P/BV คือ ROE และ playbook แนะนำเด่นกับธนาคาร จึงไม่ใช้เป็นวิธีหลักของผู้ผลิตฮาร์ดแวร์ (playbook §9)
limitations:
- Yahoo มีงบเต็มเพียง 4 ปี 2022–2025 สั้นกว่าช่วง 5–10 ปีที่ playbook §8 แนะนำสำหรับการ normalize ธุรกิจตามรอบ
- รายได้ลดลงทุกปี 2022–2025 ร่างนี้ใช้ terminal growth 0.80% แทนการลาก CAGR ติดลบ −6.88% ต่ออีก 5 ปี ผล DCF จึงขึ้นกับสมมติฐานว่ารายได้หยุดลดลง
- peer อยู่ไต้หวันและมีขนาดใหญ่กว่า CCET หลายบริษัท แม้ Yahoo จัด 4 ใน 5 ตัวอยู่หมวด Computer Hardware เดียวกัน ความเสี่ยงประเทศ สกุลเงิน และ product mix ยังต่างกัน
- bottom-up beta ของ Computers/Peripherals ตลาดเกิดใหม่สูงกว่า regression beta ของ Yahoo มาก ต้องแสดง sensitivity ก่อนสรุปผล
- CCET มีรายได้จากต่างประเทศ แต่ Yahoo ไม่มีสัดส่วนรายได้รายประเทศ จึงใช้ country risk premium ของไทยเต็มจำนวนแทนการถ่วงตามรายได้ (playbook §3)
- P/E ใช้ EPS TTM ถึงไตรมาส 2/2026 แต่ DCF และ EV/EBITDA ใช้งบรายปี 2025 จึงเป็นคนละงวด
- ไม่มี precedent transactions และ analyst target price เพราะไม่มีข้อมูลใน Trust sources
